# Firebase App Hosting configuration

runConfig:
  runtime: nodejs22
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0

env:
  # Firebase Admin credentials live in Secret Manager — never in the repo.
  - variable: FIREBASE_SERVICE_ACCOUNT
    secret: FIREBASE_SERVICE_ACCOUNT
  # JWT signing secret — must be stable across restarts.
  - variable: AUTH_SECRET
    value: "aafa279af673711330bdc607f32fe9341c33ee336b370b7e86e46f8b489dd000"
  # Deposit wallet address — needed at build time for NEXT_PUBLIC exposure.
  - variable: NEXT_PUBLIC_DEPOSIT_WALLET_BEP20
    value: "0x81EBa2Cb09a9e65225E7246D561038064Ff9be39"
  # Server-side auto-verify uses this (not exposed to client).
  - variable: TETHERLY_DEPOSIT_WALLET_BEP20
    value: "0x81EBa2Cb09a9e65225E7246D561038064Ff9be39"
